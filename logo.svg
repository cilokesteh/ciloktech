<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="ringGrad" cx="38%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#e8d5ab"/>
      <stop offset="55%" stop-color="#c8a96a"/>
      <stop offset="100%" stop-color="#8a7448"/>
    </radialGradient>
    <linearGradient id="ctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="50%" stop-color="#c8a96a"/>
      <stop offset="100%" stop-color="#8a7448"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer gold ring -->
  <circle cx="32" cy="32" r="30" fill="url(#ringGrad)"/>
  <!-- Inner dark cavity -->
  <circle cx="32" cy="32" r="25" fill="#0b0a08"/>
  <!-- C: thick crescent arc, outer edge merging into ring -->
  <path d="M 32 8 A 22 22 0 1 0 32 56" stroke="url(#ctGrad)" stroke-width="16" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <!-- C top arm -->
  <rect x="23" y="16.5" width="23" height="5" rx="2.5" fill="url(#ctGrad)" filter="url(#glow)"/>
  <!-- C bottom arm -->
  <rect x="19" y="42" width="17" height="5" rx="2.5" fill="url(#ctGrad)" filter="url(#glow)"/>
  <!-- T crossbar: x29-63 -->
  <rect x="29" y="29" width="34" height="5" rx="2.5" fill="url(#ctGrad)" filter="url(#glow)"/>
  <!-- T stem: x54-59, y8-54 -->
  <rect x="54" y="8" width="5" height="46" rx="2.5" fill="url(#ctGrad)" filter="url(#glow)"/>
</svg>
