<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="ringGrad" cx="38%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#e8d5ab"/>
      <stop offset="55%" stop-color="#c8a96a"/>
      <stop offset="100%" stop-color="#8a7448"/>
    </radialGradient>
    <linearGradient id="ctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="50%" stop-color="#c8a96a"/>
      <stop offset="100%" stop-color="#8a7448"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer gold ring -->
  <circle cx="32" cy="32" r="30" fill="url(#ringGrad)"/>
  <!-- Inner dark cavity -->
  <circle cx="32" cy="32" r="25" fill="#0b0a08"/>
  <!-- C: thick crescent on left -->
  <path d="
    M 42 16
    A 16 16 0 1 0 42 48
    L 36 42
    A 10 10 0 1 1 36 22
    Z
  " fill="url(#ctGrad)" filter="url(#glow)"/>
  <!-- T stem: vertical at far right -->
  <rect x="40" y="14" width="5" height="36" rx="2.5" fill="url(#ctGrad)" filter="url(#glow)"/>
  <!-- Top crossbar (T crossbar): from C opening to T stem -->
  <rect x="28" y="15" width="17" height="5" rx="2.5" fill="url(#ctGrad)" filter="url(#glow)"/>
  <!-- Bottom crossbar (C arm): wider, from inside C to past T stem -->
  <rect x="22" y="30" width="28" height="5" rx="2.5" fill="url(#ctGrad)" filter="url(#glow)"/>
</svg>
