<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="ringGrad" cx="38%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#e8d5ab"/>
      <stop offset="55%" stop-color="#c8a96a"/>
      <stop offset="100%" stop-color="#8a7448"/>
    </radialGradient>
    <linearGradient id="ctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="50%" stop-color="#c8a96a"/>
      <stop offset="100%" stop-color="#8a7448"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer gold ring -->
  <circle cx="32" cy="32" r="30" fill="url(#ringGrad)"/>
  <!-- Inner dark cavity -->
  <circle cx="32" cy="32" r="24.5" fill="#0b0a08"/>
  <!-- C: arc on left, opening right -->
  <path d="M 40 22 A 11 11 0 1 0 40 42" stroke="url(#ctGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <!-- T: vertical stem -->
  <line x1="33" y1="23" x2="33" y2="41" stroke="url(#ctGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <!-- T: horizontal crossbar through middle -->
  <line x1="28" y1="32" x2="42" y2="32" stroke="url(#ctGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
</svg>
